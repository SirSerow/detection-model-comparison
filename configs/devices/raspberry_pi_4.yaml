name: raspberry_pi_4
architecture: aarch64
default_threads: 4

capabilities:
  cuda: false
  gpu: false

backends:
  - runtime: pytorch
    precision: fp32
    device_target: cpu
  - runtime: onnxruntime
    precision: fp32
    device_target: cpu
    execution_provider: CPUExecutionProvider
  - runtime: ncnn
    precision: fp32
    device_target: cpu
  - runtime: ncnn
    precision: int8
    device_target: cpu

benchmark:
  warmup: 20
  iterations: 500

metrics:
  temperature:
    provider: raspberry_pi
  utilization:
    provider: cpu

metadata:
  cpu: Cortex-A72
  ram_gb: 8
  cooling: passive
  power_measurement: unavailable
