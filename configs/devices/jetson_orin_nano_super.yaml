name: jetson_orin_nano_super
architecture: aarch64

capabilities:
  cuda: true
  gpu: true

backends:
  - runtime: pytorch
    precision: fp16
    device_target: cuda
  - runtime: pytorch
    precision: fp32
    device_target: cuda
  - runtime: onnxruntime
    precision: fp16
    device_target: cuda
    execution_provider: CUDAExecutionProvider
  - runtime: tensorrt
    precision: fp16
    device_target: cuda
  - runtime: tensorrt
    precision: int8
    device_target: cuda

benchmark:
  warmup: 50
  iterations: 500

metrics:
  temperature:
    provider: linux_sysfs
  power:
    provider: tegrastats

metadata:
  gpu_name: NVIDIA Jetson Orin Nano Super

