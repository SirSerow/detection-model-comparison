name: rtx_3060_laptop
architecture: x86_64

capabilities:
  cuda: true
  gpu: true

backends:
  - runtime: pytorch
    precision: fp16
    device_target: cuda
  - runtime: pytorch
    precision: fp32
    device_target: cuda
  - runtime: onnxruntime
    precision: fp16
    device_target: cuda
    execution_provider: CUDAExecutionProvider
  - runtime: tensorrt
    precision: fp16
    device_target: cuda
  - runtime: tensorrt
    precision: int8
    device_target: cuda

benchmark:
  warmup: 50
  iterations: 500

metrics:
  temperature:
    provider: nvidia
  power:
    provider: nvidia_smi
  utilization:
    provider: nvidia

metadata:
  gpu_name: NVIDIA GeForce RTX 3060 Laptop GPU
  gpu_vram_gb: 6
  power_profile: ac_high_performance

